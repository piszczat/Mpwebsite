name: CI

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate promotion path
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]]; then
            echo "Promotion PRs must originate from this repository (got ${HEAD_REPOSITORY})." >&2
            exit 1
          fi

          if [[ "${BASE_BRANCH}" == "test" && "${HEAD_BRANCH}" != "dev" ]]; then
            echo "PRs into test must come from dev (got ${HEAD_BRANCH})." >&2
            exit 1
          fi

          if [[ "${BASE_BRANCH}" == "main" && "${HEAD_BRANCH}" != "test" ]]; then
            echo "PRs into main must come from test (got ${HEAD_BRANCH})." >&2
            exit 1
          fi

          echo "Promotion path accepted: ${HEAD_REPOSITORY}:${HEAD_BRANCH} -> ${BASE_BRANCH}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test
